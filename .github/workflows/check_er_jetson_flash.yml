name: Check er_jetson_flash

on: [push]

jobs:
  check_er_jetson_flash:
    # Python 3.8 has no build for ubuntu-26.04 (ubuntu-latest): https://github.com/actions/python-versions/blob/main/versions-manifest.json
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      # the payload targets the deployment machines' Ubuntu 20.04 / Python 3.8 —
      # test on that, not on whatever ubuntu-latest ships
      - name: set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: python syntax check payload
        shell: bash
        run: python3 -m py_compile bin/er_jetson_flash.py

      - name: run er_jetson_flash tests
        shell: bash
        run: |
          python3 tests/test_er_jetson_flash.py
          python3 tests/test_er_jetson_flash_rebuild.py
